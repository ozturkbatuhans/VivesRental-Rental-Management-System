name: .NET build & test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore VivesRental.sln
      - name: Build
        run: dotnet build VivesRental.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VivesRental.sln --configuration Release --no-build --verbosity normal
